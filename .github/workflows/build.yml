name: build-from-zip

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack voicemod.zip
        run: |
          unzip -q voicemod.zip -d unpacked
          DIR=$(dirname "$(find unpacked -name build.gradle | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0

      # Определяем реальный пакет Concentus в jar и правим импорты (страховка)
      - name: Detect Concentus package
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          curl -sSfL -o /tmp/c.jar https://repo.maven.apache.org/maven2/io/github/jaredmdobson/concentus/1.0.2/concentus-1.0.2.jar
          CLS=$(unzip -Z1 /tmp/c.jar | grep 'OpusEncoder.class' | head -1)
          PKG=$(dirname "$CLS" | tr / .)
          echo "Concentus package: $PKG"
          grep -rl 'concentus' src/main/java | xargs sed -i -E "s#(org\.concentus|io\.github\.jaredmdobson\.concentus)\.Opus#$PKG.Opus#g"
          grep -rn 'concentus' src/main/java || true

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: simplevoice-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
